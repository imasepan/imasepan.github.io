<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <title>imasepan — {{ page.title | default: "writing" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">imasepan<span>_</span></a>
      <div class="header-controls">
        <nav id="site-nav" class="site-nav" aria-label="Main navigation">
          <a href="/#about">About</a>
          <a href="/#projects">Projects</a>
          <a href="/blog/"{% if page.url == "/blog/" or page.layout == "post" %} aria-current="page"{% endif %}>Writing</a>
          <a href="/guestbook.html">Guestbook</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Switch color theme">Theme</button>
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      </div>
    </header>
    <main class="page-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <a class="wordmark" href="/">imasepan<span>_</span></a>
      <p>Built slowly, updated often.</p>
      <a href="https://github.com/imasepan" target="_blank" rel="noreferrer">github.com/imasepan ↗</a>
    </footer>
    <script src="/script.js"></script>
  </body>
</html>
