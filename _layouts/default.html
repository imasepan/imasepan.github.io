<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <title>imasepan — {{ page.title | default: "writing" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="/layout.js?v=20260807-2"></script>
    <link rel="stylesheet" href="/styles.css?v=20260809-5" />
    <link rel="stylesheet" href="/industrial.css?v=20260805-1" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-controls">
        <button class="wordmark" type="button" aria-expanded="false" aria-controls="header-controls">imasepan<span>_</span></button>
        <button class="theme-toggle" type="button" aria-label="Switch color theme">Theme</button>
      </div>
      <div class="header-controls" id="header-controls">
        <nav id="site-nav" class="site-nav" aria-label="Main navigation">
          <a href="/#about">About</a>
          <a href="/#projects">Projects</a>
          <a href="/studio.html">Studio</a>
          <a href="/blog/"{% if page.url == "/blog/" or page.layout == "post" %} aria-current="page"{% endif %}>Writing</a>
        </nav>
        <a class="language-switch" href="/kr/" lang="ko" aria-label="Switch to Korean">한국어</a>
        <button class="menu-button" type="button" aria-label="Navigation is always visible">Menu</button>
      </div>
    </header>
    <section class="music-banner" aria-label="Featured Spotify playlist">
      <div class="music-banner-inner">
        <p><span>Now playing</span> / My favourite songs! (that fit the mood of this website).</p>
        <iframe class="spotify-player" title="Spotify playlist" src="https://open.spotify.com/embed/playlist/3U7y10CsdmnU7IfRpZRooU?utm_source=generator" width="100%" height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" scrolling="no"></iframe>
      </div>
    </section>
    <main class="page-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <a class="wordmark" href="/">imasepan<span>_</span></a>
      <p>always doing something</p>
      <a href="https://github.com/imasepan" target="_blank" rel="noreferrer">github.com/imasepan ↗</a>
    </footer>
    <script src="/script.js?v=20260809-2"></script>
  </body>
</html>
